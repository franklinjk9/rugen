<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'spin-slow': 'spin 3s linear infinite',
          }
        }
      }
    }

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    #animated-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background-color: #87CEEB;
      transition: background-color 1.5s ease-in-out;
    }
    .dark #animated-background {
      background-color: #0d1a2f;
    }

    .celestial-object {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: all 1.5s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sun { 
      width: 140px;
      height: 140px;
      background-color: #FFD700; 
      top: 8%;
      border-radius: 50%;
      animation: pulse-shine 4s infinite ease-in-out;
    }
    
    .moon { 
      width: 100px;
      height: 100px;
      background-color: #f5f3ce; 
      top: 110%;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
    }

    .dark .sun { top: 110%; }
    .dark .moon { top: 15%; }

    @keyframes pulse-shine {
      0% { box-shadow: 0 0 20px 5px rgba(255, 223, 0, 0.7); }
      50% { box-shadow: 0 0 45px 25px rgba(255, 223, 0, 0.3); }
      100% { box-shadow: 0 0 20px 5px rgba(255, 223, 0, 0.7); }
    }

    .sun-logo-container {
        width: 130px;
        height: 130px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-image: ${sunlogo};
    }

    .moon-logo-container {
        width: 65px;
        height: 65px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-image: ${moonlogo};
    }
    
    .cloud {
        position: absolute;
        width: 200px;
        height: 60px;
        background: white;
        border-radius: 30px;
        opacity: 0.6;
        animation: drift 60s linear infinite;
    }
    .cloud::before, .cloud::after {
        content: '';
        position: absolute;
        background: white;
        border-radius: 50%;
    }
    .cloud::before { width: 100px; height: 100px; top: -50px; left: 30px; }
    .cloud::after { width: 70px; height: 70px; top: -30px; right: 20px; }
    .cloud.c1 { top: 10%; left: -250px; transform: scale(0.8); animation-duration: 70s; }
    .cloud.c2 { top: 20%; left: -500px; transform: scale(1.1); animation-duration: 50s; }
    .cloud.c3 { top: 15%; left: -800px; transform: scale(0.6); animation-duration: 80s; }

    @keyframes drift {
        from { transform: translateX(0); }
        to { transform: translateX(2200px); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-slide-in { animation: slideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .theme-transition { 
      transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                  color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .location-options::-webkit-scrollbar { display: none; }
    .location-options { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

  <script>
    class ThemeManager {
      constructor() {
        this.audioPlayer = document.getElementById('dark-mode-song');
        this.bindInitialInteraction();
        this.init();
      }
      
      bindInitialInteraction() {
        const handleFirstInteraction = () => {
          if (document.documentElement.classList.contains('dark')) {
            this.audioPlayer?.play().catch(e => console.log("User interaction unlocked audio."));
          }
        };
        document.body.addEventListener('click', handleFirstInteraction, { once: true });
        document.body.addEventListener('keydown', handleFirstInteraction, { once: true });
      }

      init() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          this.enableDarkMode(false);
        } else {
          this.enableLightMode();
        }
        
        this.updateIcons();
        this.bindEvents();
      }
      
      enableDarkMode(playAudio = true) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        localStorage.setItem('theme', 'dark');
        if (playAudio) {
          this.audioPlayer?.play().catch(e => console.log("Autoplay was prevented."));
        }
      }
      
      enableLightMode() {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('theme', 'light');
        this.audioPlayer?.pause();
      }
      
      toggle() {
        const isDark = document.documentElement.classList.contains('dark');
        
        if (isDark) {
          this.enableLightMode();
        } else {
          this.enableDarkMode();
        }
        
        this.updateIcons();
        this.updateTurnstileTheme();
      }
      
      updateIcons() {
        const isDark = document.documentElement.classList.contains('dark');
        document.getElementById('sun-icon').style.display = isDark ? 'none' : 'block';
        document.getElementById('moon-icon').style.display = isDark ? 'block' : 'none';
      }
      
      updateTurnstileTheme() {
        const turnstile = document.querySelector('.cf-turnstile');
        if (turnstile) {
          turnstile.setAttribute('data-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
      }
      
      bindEvents() {
        document.getElementById('theme-toggle')?.addEventListener('click', (e) => {
          e.preventDefault();
          this.toggle();
        });
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            if (e.matches) {
              this.enableDarkMode();
            } else {
              this.enableLightMode();
            }
            this.updateIcons();
            this.updateTurnstileTheme();
          }
        });
      }
    }
    
    class FormManager {
      constructor() {
        this.form = document.getElementById('config-form');
        this.bindEvents();
      }
      
      bindEvents() {
        this.form?.addEventListener('submit', this.handleSubmit.bind(this));
      }

      async handleSubmit(e) {
        e.preventDefault();

        const formData = new FormData(this.form);
        const turnstileResponse = formData.get('cf-turnstile-response');

        if (!turnstileResponse) {
          this.showAlert('⚠️ Please complete the CAPTCHA challenge', 'error');
          return;
        }

        this.updateButtonState(true);

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                body: formData,
            });

            if (response.ok) {
                const blob = await response.blob();
                const header = response.headers.get('Content-Disposition');
                let filename = 'riseup.ovpn';
                if (header) {
                    const parts = header.split(';');
                    parts.forEach(part => {
                        if (part.trim().startsWith('filename=')) {
                            filename = part.split('=')[1].replaceAll('"', '').trim();
                        }
                    });
                }
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
                
                if (window.turnstile) {
                    window.turnstile.reset();
                }
                this.updateButtonState(false);

            } else {
                location.reload();
            }
        } catch (error) {
            console.error('Form submission error:', error);
            this.showAlert('An unexpected error occurred.', 'error');
            this.updateButtonState(false);
        }
      }

      updateButtonState(loading) {
        const btn = document.getElementById('generate-btn');
        const btnText = document.getElementById('btn-text');
        const iconDefault = document.getElementById('icon-default');
        const iconLoading = document.getElementById('icon-loading');
        if (loading) {
          btn.disabled = true;
          btnText.textContent = 'Generating...';
          iconDefault.classList.add('hidden');
          iconLoading.classList.remove('hidden');
        } else {
          btn.disabled = false;
          btnText.textContent = 'Generate & Download';
          iconDefault.classList.remove('hidden');
          iconLoading.classList.add('hidden');
        }
      }
      
      showAlert(message, type = 'info') {
        const alertDiv = document.createElement('div');
        const bgColor = type === 'error' ? 'bg-red-500' : 'bg-blue-500';
        alertDiv.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50 transform translate-x-full transition-all duration-300`;
        alertDiv.innerHTML = message;
        document.body.appendChild(alertDiv);
        setTimeout(() => alertDiv.classList.remove('translate-x-full'), 100);
        setTimeout(() => {
          alertDiv.classList.add('translate-x-full');
          setTimeout(() => { if (document.body.contains(alertDiv)) { document.body.removeChild(alertDiv); } }, 300);
        }, 3000);
      }
    }

    class UIManager {
        constructor() {
            this.initProtocolToggle();
            this.initInfoTooltip();
            this.initLocationDropdown();
        }

        initProtocolToggle() {
            const toggle = document.getElementById('protocol-toggle');
            if (!toggle) return;
            const mover = toggle.querySelector('.mover');
            const tcpLabel = toggle.querySelector('label[for="proto-tcp"]');
            const udpLabel = toggle.querySelector('label[for="proto-udp"]');

            const setToggle = () => {
                if (document.getElementById('proto-udp').checked) {
                    mover.style.transform = 'translateX(100%)';
                    udpLabel.classList.remove('text-gray-500', 'dark:text-gray-400');
                    udpLabel.classList.add('text-gray-800', 'dark:text-gray-200');
                    tcpLabel.classList.add('text-gray-500', 'dark:text-gray-400');
                    tcpLabel.classList.remove('text-gray-800', 'dark:text-gray-200');
                } else {
                    mover.style.transform = 'translateX(0)';
                    tcpLabel.classList.remove('text-gray-500', 'dark:text-gray-400');
                    tcpLabel.classList.add('text-gray-800', 'dark:text-gray-200');
                    udpLabel.classList.add('text-gray-500', 'dark:text-gray-400');
                    udpLabel.classList.remove('text-gray-800', 'dark:text-gray-200');
                }
            };
            toggle.addEventListener('click', (e) => {
                if (e.target.htmlFor === 'proto-tcp') document.getElementById('proto-tcp').checked = true;
                if (e.target.htmlFor === 'proto-udp') document.getElementById('proto-udp').checked = true;
                setToggle();
            });
            setToggle();
        }

        initInfoTooltip() {
            const button = document.getElementById('dns-info-button');
            const tooltip = document.getElementById('dns-info-tooltip');
            if (!button || !tooltip) return;

            button.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                tooltip.classList.toggle('hidden');
            });
            document.addEventListener('click', () => tooltip.classList.add('hidden'));
        }
        
        initLocationDropdown() {
            const container = document.getElementById('location-dropdown-container');
            const button = document.getElementById('location-button');
            const optionsContainer = document.getElementById('location-options');
            if (!container || !button || !optionsContainer) return;

            button.addEventListener('click', (e) => {
                e.stopPropagation();
                optionsContainer.classList.toggle('hidden');
            });
            document.addEventListener('click', () => optionsContainer.classList.add('hidden'));
            optionsContainer.addEventListener('click', (e) => e.stopPropagation());

            this.loadLocations(optionsContainer, document.getElementById('location-button-text'));
        }

        async loadLocations(container, buttonText) {
            try {
                const response = await fetch('/locations');
                if (!response.ok) throw new Error('Network response was not ok');
                const locations = await response.json();
                this.renderLocationCheckboxes(container, buttonText, locations);
            } catch (error) {
                container.innerHTML = '<p class="text-red-500 p-4 text-center">Failed to load locations.</p>';
                console.error('Error fetching locations:', error);
            }
        }

        renderLocationCheckboxes(container, buttonText, locations) {
            container.innerHTML = '';
            
            const createCheckbox = (value, text, checked = false) => {
                const div = document.createElement('div');
                div.className = 'flex items-center space-x-3 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600';
                const label = document.createElement('label');
                label.className = 'flex-1 flex items-center space-x-3 cursor-pointer font-medium text-gray-700 dark:text-gray-300';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = 'locations';
                checkbox.value = value;
                checkbox.checked = checked;
                checkbox.className = 'w-5 h-5 rounded text-cyan-600 focus:ring-2 focus:ring-cyan-500/50 bg-white dark:bg-gray-700 border-gray-300 dark:border-gray-500';
                const span = document.createElement('span');
                span.textContent = text;
                label.appendChild(checkbox);
                label.appendChild(span);
                div.appendChild(label);
                return div;
            };

            const allDiv = createCheckbox('All', 'All Locations', true);
            container.appendChild(allDiv);

            locations.forEach(location => {
                const div = createCheckbox(location.name, `${countryCodeToEmoji(location.code)} ${location.name}`);
                container.appendChild(div);
            });

            const allCheckbox = container.querySelector('input[value="All"]');
            const locationCheckboxes = Array.from(container.querySelectorAll('input[name="locations"]:not([value="All"])'));

            const updateUI = () => {
                const selectedLocations = locationCheckboxes.filter(cb => cb.checked);
                
                if (allCheckbox.checked || selectedLocations.length === 0) {
                    buttonText.textContent = 'All Locations';
                } else if (selectedLocations.length === 1) {
                    buttonText.textContent = selectedLocations[0].value;
                } else {
                    buttonText.textContent = `${selectedLocations.length} locations selected`;
                }
            };

            allCheckbox.addEventListener('change', () => {
                if (allCheckbox.checked) {
                    locationCheckboxes.forEach(cb => { cb.checked = false; });
                }
                updateUI();
            });

            locationCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const anyLocationChecked = locationCheckboxes.some(c => c.checked);
                    allCheckbox.checked = !anyLocationChecked;
                    updateUI();
                });
            });

            updateUI();
        }
    }
    
    function countryCodeToEmoji(code) {
        if (!code || code.length !== 2) return '🌐';
        const OFFSET = 127397;
        const [first, second] = [...code.toUpperCase()].map(char => char.charCodeAt(0) + OFFSET);
        return String.fromCodePoint(first, second);
    }

    document.addEventListener('DOMContentLoaded', function() {
      new ThemeManager();
      new FormManager();
      new UIManager();

      const renewalNote = document.getElementById('renewal-note');
      const closeButton = document.getElementById('close-renewal-note');
      if (renewalNote && closeButton) {
        closeButton.addEventListener('click', () => {
          renewalNote.style.transition = 'opacity 0.3s ease-out, transform 0.3s ease-out';
          renewalNote.style.opacity = '0';
          renewalNote.style.transform = 'scale(0.95)';
          setTimeout(() => {
            renewalNote.remove();
          }, 300);
        });
      }
    });
  </script>
